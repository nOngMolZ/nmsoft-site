services:
  nmsoft-site:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: nmsoft-site
    restart: unless-stopped
    environment:
      - NODE_ENV=production
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

    networks:
      - traefik

    labels:
      - "traefik.enable=true"

      # บอก Traefik ว่าควรใช้ network ชื่อ traefik เวลาเชื่อมเข้า service นี้
      - "traefik.docker.network=traefik"

      # =========================
      # HTTPS router (ของจริง)
      # =========================
      - "traefik.http.routers.nmsoft-site.rule=Host(`nmsoft.co`)"
      - "traefik.http.routers.nmsoft-site.entrypoints=websecure"
      - "traefik.http.routers.nmsoft-site.tls.certresolver=myresolver"
      - "traefik.http.services.nmsoft-site.loadbalancer.server.port=80"

      # =========================
      # HTTP router (แค่ไว้ redirect)
      # =========================
      - "traefik.http.routers.nmsoft-site-web.rule=Host(`nmsoft.co`)"
      - "traefik.http.routers.nmsoft-site-web.entrypoints=web"
      - "traefik.http.routers.nmsoft-site-web.middlewares=redirect-to-https"

      # =========================
      # Middleware: redirect http -> https
      # =========================
      - "traefik.http.middlewares.redirect-to-https.redirectscheme.scheme=https"
      - "traefik.http.middlewares.redirect-to-https.redirectscheme.permanent=true"

networks:
  traefik:
    external: true
