services:
  nmsoft-site:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: nmsoft-site
    restart: unless-stopped
    environment:
      - NODE_ENV=production
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

    networks:
      - traefik

    labels:
      # Enable Traefik
      - traefik.enable=true
      - traefik.docker.network=traefik

      # HTTP Router (redirect to HTTPS)
      - traefik.http.routers.nmsoft-site-http.rule=Host(`nmsoft.co`) || Host(`www.nmsoft.co`)
      - traefik.http.routers.nmsoft-site-http.entrypoints=web
      - traefik.http.routers.nmsoft-site-http.middlewares=nmsoft-redirect

      # HTTPS Router
      - traefik.http.routers.nmsoft-site.rule=Host(`nmsoft.co`) || Host(`www.nmsoft.co`)
      - traefik.http.routers.nmsoft-site.entrypoints=websecure
      - traefik.http.routers.nmsoft-site.tls=true
      - traefik.http.routers.nmsoft-site.tls.certresolver=myresolver

      # Middleware for redirect HTTP to HTTPS
      - traefik.http.middlewares.nmsoft-redirect.redirectscheme.scheme=https
      - traefik.http.middlewares.nmsoft-redirect.redirectscheme.permanent=true

      # Service (nginx runs on port 80)
      - traefik.http.services.nmsoft-site.loadbalancer.server.port=80

networks:
  traefik:
    external: true
