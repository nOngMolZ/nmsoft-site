services:
  nmsoft-site:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: nmsoft-site
    restart: unless-stopped
    environment:
      - NODE_ENV=production
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

    networks:
      - traefik

    labels:
      - "traefik.enable=true"
      # ระบุ network ที่ Traefik ใช้ในการเชื่อมต่อ service
      - "traefik.docker.network=traefik"

      # ให้ traefik รู้ว่าโดนยิงตอน Host = nmsoft.co
      - "traefik.http.routers.nmsoft-site.rule=Host(`nmsoft.co`)"

      # ใช้ HTTPS entrypoint ของ traefik
      - "traefik.http.routers.nmsoft-site.entrypoints=websecure"

      # ออก cert ด้วย Let's Encrypt resolver ชื่อ myresolver (ตาม traefik.yml ที่ตั้งไว้)
      - "traefik.http.routers.nmsoft-site.tls.certresolver=myresolver"

      # ระบุ port ของ service ชัดๆ กันพลาด (ใน container คือ 80)
      - "traefik.http.services.nmsoft-site.loadbalancer.server.port=80"

      # สร้าง HTTP router เพื่อ redirect ไป HTTPS (web -> websecure)
      - "traefik.http.routers.nmsoft-site-web.rule=Host(`nmsoft.co`)"
      - "traefik.http.routers.nmsoft-site-web.entrypoints=web"
      - "traefik.http.routers.nmsoft-site-web.middlewares=redirect-to-https"
      - "traefik.http.middlewares.redirect-to-https.redirectscheme.scheme=https"

networks:
  traefik:
    external: true
